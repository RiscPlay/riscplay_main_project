<div  class="row py-2">
    <div class="col">
        <div class="row">
            <hr>
        </div>

        <div class="row">
            <div class="col">
                <input class="form-check-input" type="checkbox" x-model="enable_make_program_interface"
                    id="enable_make_program_interface">
                <label class="form-check-label" for="enable_make_program_interface">
                    Make or edit program
                </label>
            </div>

        </div>
        <div class="row py-3">
            <div class="col">
                <template x-if="enable_make_program_interface">
                    <div class="row">
                        <div class="col">
                            <div class="row">
                                <div class="col">
                                    <h1>Program data</h1>
                                </div>
                            </div>
                            <div class="row py-2">
                                <div class="col">
                                    <div class="row py-1">
                                        <div class="col">
                                            <button class="btn btn-secondary"
                                                @click="add_component___upload_memory(COMP___UPLOAD_MEMORY__IS_SPRITE)">Add
                                                sprite</button>
                                        </div>
                                    </div>
                                    <div class="row py-1">
                                        <div class="col">
                                            <button class="btn btn-secondary" 
                                                            :disabled="!check_if___generate_file___and___upload_program_and_data_to_fpga___can_be_called()" 
                                                            @click="generate_file()">
                                                Download program
                                            </button>
                                        </div>
                                    </div>
                                    <div class="row py-1">
                                        <div class="col d-flex align-items-center">
                                            <label class="mr-10 mb-0 flex-shrink-0" style="padding-right: 1em;">Program
                                                to upload: </label> <input type="file" class="form-control"
                                                x-ref="inputArquivo" @change="arquivo =uploadProgram($event)">
                                        </div>
                                    </div>
                                    <div class="row py-1">
                                        <div class="col">
                                             <button class="btn btn-secondary" 
                                                            :disabled="(!check_if___generate_file___and___upload_program_and_data_to_fpga___can_be_called()) || sending_data"
                                                            @click="upload_program_and_data_to_fpga()">
                                                    Program fpga
                                            </button> Progress <span x-text="n_words_sent"></span> : <span x-text="n_total_words"></span
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="row py-2">

                        </div>
                        <template x-for="comp in components_of_type___upload_memory" :key="comp.comp_uuid">
                            <div class="row">
                                <template x-if="comp.type==COMP___UPLOAD_MEMORY__IS_SPRITE">

                                    <div class="col" x-data="comp___upload_memory(
                                        {
                                            comp_uuid: comp.comp_uuid,
                                            addr_serv: this.addr_serv, 
                                            label: 'Upload Sprite',
                                            type: COMP___UPLOAD_MEMORY__IS_SPRITE,
                                            addr_mem: comp.addr,
                                            pixels: comp.pixels,
                                            palette: comp.palette,
                                            block_action_send: true,
                                            block_remove_action: false,
                                            remove_component: (comp_uuid)=> {remove_component(comp_uuid)},
                                            dataToSend: comp.value,
                                            show_warnings_about_addr_or_file_need_to_be_selected: true,
                                            func_to_call_when_addr_is_updated: (comp_uuid,addr) => update_addr_value(comp_uuid, addr),
                                            func_to_call_when_data_is_updated: (comp_uuid, name, data) => update_data_value(comp_uuid, name, data)
                                        })" hx-get="comp___upload_memory.html" hx-trigger="load"
                                        x-init="$nextTick(() => htmx.process($el));">
                                    </div>

                                </template>

                                <template x-if="comp.type==COMP___UPLOAD_MEMORY__IS_FILE">
                                    <div class="col" x-data="comp___upload_memory(
                                            {
                                                comp_uuid: comp.comp_uuid,
                                                addr_serv: this.addr_serv, 
                                                label: 'Upload firmware',
                                                type: COMP___UPLOAD_MEMORY__IS_FILE,
                                                block_action_send: true,
                                                addr_mem: comp.addr_mem,
                                                block_input_value:true,
                                                dataToSend__HexFormat: comp.value,
                                                show_warnings_about_addr_or_file_need_to_be_selected: true,
                                                func_to_call_when_addr_is_updated: (comp_uuid,addr) => update_addr_value(comp_uuid,addr),
                                                func_to_call_when_data_is_updated: (comp_uuid, name, data) => update_data_value(comp_uuid, name, data)
                                            })" hx-get="comp___upload_memory.html" hx-trigger="load"
                                        x-init="$nextTick(() => htmx.process($el))">
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
            </div>
            </template>
        </div>
    </div>
</div>
</div>
