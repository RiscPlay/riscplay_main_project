<div class="row py-2">
    <div class="col">
        <h3 x-text="label"></h3>
    </div>

    <div class="row align-items-center py-2">

        <div class="col">
            <div class="docs-card docs-card-alt card ">
                <div class="card-body p-2">
                    <div class=" text-center p-20 py-sm-4"
                        style="border: 2px dashed var(--border-color); cursor: pointer;"
                        @click="file_upload_box____click_event()">
                        <p class="text-muted" x-text="file_name_sel"></p>
                        <h5 class="card-title">Click here to select file to upload</h5>

                        <input :id="fileInputID" type="file" hidden @change="action_send_file_to_js_browser_memory($event)">
                    </div>
                </div>
            </div>
        </div>
    </div>
     
    <div class="row" hx-get="comp___input_field_hexa.html"
        hx-trigger="load"
        hx-swap="innerHTML"
        x-data="comp___input_field_hexadecimal({
            label: 'Addr to write',
            buttonText: 'Upload',
            initial_input_value: addr_mem,
            block_input_value:block_input_value,
            action: (addr) => uploadDataToFPGA(addr)
        })">
    </div> 
    <div class="row" style="margin-top: -10px;">
        <div class="col">
                <span x-text="data_words_sent"></span> : <span x-text="data_total_words"></span>
        </div>
    </div>
    <template x-if="display_canvas">
        <div class="row py-1">
            <div class="col">
                <canvas  :id="canvasID" :width="canvas_w" :height="canvas_h"></canvas>
            </div>
        </div>
    </template>
    <template x-if="error">
        <div class="row py-1">
            <div class="col">
                <div class="alert alert-danger" role="alert">
                    <h5 class="alert-heading">Danger</h5>
                    Upload error inside.
                </div>
            </div>
        </div>
    </template>
</div>
